name: Data Integrity

on:
  pull_request:
    branches:
      - alpha
      - main
  push:
    branches:
      - alpha
      - main

permissions:
  contents: read

jobs:
  data-integrity:
    name: Data Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate complete mining tables
        run: node scripts/validate-data-integrity.mjs
